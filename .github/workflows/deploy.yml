name: Cloud Monitor Deploy
run-name: Deploy production • ${{ github.event.inputs.ref || github.event.workflow_run.head_branch || github.ref_name }} • @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to deploy
        required: true
        default: main
        type: string
  workflow_run:
    workflows: ["Cloud Monitor CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production server
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.workflow_run.head_sha }}

      - name: Resolve deploy revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail

          deploy_ref="${{ github.event.inputs.ref || github.event.workflow_run.head_sha }}"
          case "$deploy_ref" in
            -*|''|*[!A-Za-z0-9._/@-]*)
              echo "Unsupported deploy ref: $deploy_ref" >&2
              exit 1
              ;;
          esac

          deploy_sha="$(git rev-parse --verify HEAD)"
          echo "sha=$deploy_sha" >>"$GITHUB_OUTPUT"
          echo "Deploy ref: $deploy_ref"
          echo "Deploy sha: $deploy_sha"

      - name: Prepare SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOY_HOST" ]; then
            echo "DEPLOY_HOST secret is required" >&2
            exit 1
          fi

          if printf '%s' "$DEPLOY_HOST" | grep -Eq '[[:space:]]'; then
            echo "DEPLOY_HOST must not contain whitespace" >&2
            exit 1
          fi

          case "$DEPLOY_HOST" in
            *://*|*@*|*/*|*:*)
              echo "DEPLOY_HOST must be a host only, such as an EC2 public IPv4 address or public DNS name. Do not include scheme, user, path, or port." >&2
              exit 1
              ;;
          esac

          if ! getent ahosts "$DEPLOY_HOST" >/dev/null; then
            echo "DEPLOY_HOST could not be resolved from the GitHub runner. Use a public IPv4 address or public DNS name reachable from GitHub Actions." >&2
            exit 1
          fi

          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "DEPLOY_SSH_KEY secret is required" >&2
            exit 1
          fi

          deploy_port="${DEPLOY_PORT:-22}"
          case "$deploy_port" in
            *[!0-9]*|'')
              echo "DEPLOY_PORT must be numeric" >&2
              exit 1
              ;;
          esac

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" >"$HOME/.ssh/cloud-monitor-deploy"
          chmod 600 "$HOME/.ssh/cloud-monitor-deploy"
          ssh-keyscan -p "$deploy_port" "$DEPLOY_HOST" >>"$HOME/.ssh/known_hosts"

      - name: Deploy over SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_REF: ${{ github.event.inputs.ref || github.event.workflow_run.head_sha }}
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail

          deploy_user="${DEPLOY_USER:-}"
          deploy_port="${DEPLOY_PORT:-22}"
          deploy_path="${DEPLOY_PATH:-/opt/cloud-monitor}"

          if [ -z "$deploy_user" ]; then
            echo "DEPLOY_USER secret is required" >&2
            exit 1
          fi

          case "$deploy_user" in
            *[!A-Za-z0-9._-]*|'')
              echo "DEPLOY_USER contains unsupported characters" >&2
              exit 1
              ;;
          esac

          case "$deploy_path" in
            ''|*[!A-Za-z0-9._/@-]*)
              echo "DEPLOY_PATH contains unsupported characters" >&2
              exit 1
              ;;
          esac

          ssh \
            -i "$HOME/.ssh/cloud-monitor-deploy" \
            -p "$deploy_port" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$deploy_user@$DEPLOY_HOST" \
            "DEPLOY_PATH=$deploy_path DEPLOY_REF=$DEPLOY_REF DEPLOY_SHA=$DEPLOY_SHA sh -s" <<'REMOTE'
          set -eu

          cd "$DEPLOY_PATH"
          git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*"
          git rev-parse --verify "$DEPLOY_SHA^{commit}" >/dev/null
          git checkout --force "$DEPLOY_SHA"
          DEPLOY_PATH="$DEPLOY_PATH" DEPLOY_REF="$DEPLOY_REF" DEPLOY_SHA="$DEPLOY_SHA" sh scripts/deploy-production.sh
          REMOTE
